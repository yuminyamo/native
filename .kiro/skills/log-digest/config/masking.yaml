# 顧客情報のマスキング規則
#
# 一致した値を <TOKEN_001> の形に置き換えます。同じ値は常に同じ記号になるので、
# 「同じユーザーの操作」をマスク後も追跡できます。
# 名前付きグループ value があればその部分だけ、無ければ一致全体を置き換えます。
# 規則は上から順に適用します。
#
# 【仮】実ログを見ていないため、一般的な key=value 形式と URL・IP・メールだけを対象にしています。
# 実ログでユーザー名・文書名・PC名がどう出力されるかを確認して追加してください（README「残作業」参照）。

rules:
  - name: email
    token: MAIL
    pattern: '[A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'
    case_insensitive: true

  # ldap://dc2.corp-a.local や \\PC-SALES-012\share のホスト名部分
  - name: url_host
    token: HOST
    pattern: '[A-Za-z][A-Za-z0-9+.-]*://(?:[^@/\s]+@)?(?P<value>[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)'
    case_insensitive: true
  - name: unc_host
    token: HOST
    pattern: '\\\\(?P<value>[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)\\'
    case_insensitive: true

  # 社内ドメインらしいホスト名（*.local など）
  - name: internal_fqdn
    token: HOST
    pattern: '\b[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*\.(?:local|lan|corp|internal|intra)\b'
    case_insensitive: true

  # C:\Users\tanaka\... / /home/tanaka/... のユーザー名部分
  - name: profile_path_user
    token: USER
    pattern: '(?i)(?:[A-Z]:\\(?:Users|Documents and Settings)\\|/(?:home|Users)/)(?P<value>[^\\/\s"]+)'
    case_insensitive: true

  - name: ipv4
    token: IP
    pattern: '(?<![\d.])(?:\d{1,3}\.){3}\d{1,3}(?![\d.])'

  # user=tanaka / user: "Taro Yamada" / ユーザー：山田
  - name: user_kv
    token: USER
    pattern: '(?i)\b(?:user|username|user_name|userid|user_id|account|owner|login)\s*[=:]\s*(?:"(?P<value>[^"]+)"|''(?P<value2>[^'']+)''|(?P<value3>[^\s",;)\]]+))'
    case_insensitive: true
  - name: user_kv_ja
    token: USER
    pattern: '(?:ユーザー名|ユーザ名|ユーザー|ユーザ|利用者|所有者)\s*[=:：]\s*(?P<value>[^\s,;、)）\]]+)'
    case_insensitive: true

  # document="見積書.xlsx" / doc=report.pdf / 文書名：議事録.docx
  - name: document_kv
    token: DOC
    pattern: '(?i)\b(?:document|doc|docname|doc_name|filename|file_name|title|jobname|job_name)\s*[=:]\s*(?:"(?P<value>[^"]+)"|''(?P<value2>[^'']+)''|(?P<value3>[^\s",;)\]]+))'
  - name: document_kv_ja
    token: DOC
    pattern: '(?:文書名|ドキュメント名|ファイル名|ジョブ名)\s*[=:：]\s*(?P<value>[^\s,;、)）\]]+)'

  # host=PC-SALES-012 / client: PC-ACC-003
  - name: host_kv
    token: HOST
    pattern: '(?i)\b(?:host|hostname|pc|pcname|client|computer|machine|workstation|terminal)\s*[=:]\s*(?:"(?P<value>[^"]+)"|(?P<value2>[^\s",;)\]]+))'
    case_insensitive: true
