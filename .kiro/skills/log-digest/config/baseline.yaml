# 平常プロファイル（平常期間との比較・変化点）のしきい値
#
# 同じ顧客環境の「正常に動いていたと思われる期間」と障害時を比べるための規則です。
# 書かなかった項目は既定値（scripts/logdigest/baseline.py の DEFAULTS）になります。
#
# 【仮】実ログを見ずに架空例（INC-2026-0931）で決めた値です。使いながら調整します（README「残作業」参照）。

# 営業日の判定: 1日の件数が、障害日より前の全日の中央値のこの割合以上なら営業日（カレンダーは使わない）
business_day_ratio: 0.5

# ログの期間がその日の 0:00 + この分数 〜 24:00 - この分数 を覆っていれば「全日あり」とする
full_day_margin_minutes: 60

change_points:
  # 出現・消失と言うために必要な、変化の前の日数（全日ありの日だけ数える）
  min_history_days: 3
  # 出現: 出始めた日以降、この割合以上の日に出ていること（1回だけ出たログを除くため）
  appear_persist_ratio: 0.5
  # 消失: 消えた日より前に、この割合以上の日に出ていたこと
  vanish_presence_ratio: 0.8

selection:
  # 平常期間の候補から外す「ERROR が急増した日」: ERROR 件数が営業日の中央値のこの倍数を超え、かつ下の件数以上
  error_spike_ratio: 3.0
  error_spike_min: 10

compare:
  # 消失: 平常期間から予想される件数（時間窓の長さに換算）がこれ以上なのに、時間窓で0件
  vanished_min_expected: 5
  # 急増: 時間窓でこの件数以上、かつ平常期間のこの倍数以上
  surge_min_count: 10
  surge_ratio: 5.0
  # 激減: 平常期間から予想される件数がこれ以上で、時間窓ではこの割合以下
  drop_min_expected: 20
  drop_ratio: 0.2

noise:
  # 既知ノイズでも、平常期間に無く時間窓にこの件数以上出ていたらノイズ扱いをやめる（急増・出現の場合は常にやめる）
  suspend_new_min_count: 5

# 障害日のログしか無い場合に、時間窓より前を比較に使うための最小の長さ（分）
fallback_min_minutes: 30
