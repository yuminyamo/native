# 既知ノイズ辞書（案3の受け口）
#
# 平常時から出ている WARN / ERROR を理由付きで登録します。一致したテンプレートは
# ダイジェストの集計・ERROR抽出から外し、「除外した」ことだけを1行で残します。
#
# - template: Drain3 のテンプレート文字列と照合する。<*> や <NUM> などの <...> は任意の文字列に一致する
# - versions: 製品バージョン（--product-version）と fnmatch で照合する。省略時は ["*"]
# - reason:   必須。理由のない除外は本当の原因を隠す原因になる
# - added:    登録時期と登録者（任意）
#
# 【仮】まだ1件も登録していません。下はガイドの架空例です。実際の登録は README「残作業」参照。
