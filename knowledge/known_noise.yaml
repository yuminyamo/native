# 既知ノイズ辞書（障害ログAI調査ガイド 案3）
#
# 平常時から出ている WARN / ERROR を、理由と根拠付きで登録する。
# - 作る: log-knowledge skill（再現環境の正常期間のログから候補を出し、AI がソースコードを読んで理由を書く）
# - 読む: log-digest skill（一致したテンプレートをダイジェストの下に回す。今回だけ急増・出現したものは下に回さない）
#
# 人のレビューは前提にしていない。直接編集せず、log-knowledge の noise-merge で更新する。
#
# 項目:
#   template:     Drain3 のテンプレート。<*> や <NUM> などの <...> は任意の文字列に一致する
#   versions:     製品バージョン（fnmatch）。例: ["5.2.*"]
#   reason:       必須。影響がないと言える理由
#   evidence:     根拠。source（どの環境・期間のログか）、rate（平常時の件数）、code（出力箇所 ファイル:行）
#   generated_by: 生成したもの
#   added:        登録日
[]
