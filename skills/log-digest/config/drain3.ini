; Drain3 の設定（テンプレート化）
;
; Drain3 に渡すのは、時刻・レベル・コンポーネントを除いたメッセージ1行目だけです。
; [MASKING] は「毎回変わる値」（数値・パス・IDなど）を記号にしてテンプレートをまとめるための設定です。
;
; 注意: configparser で読まれるため、正規表現の中でパーセント記号を使わないこと。
; JSON の中なのでバックスラッシュは二重に書く。
;
; 【仮】ジョブID（J-20391 の形）はガイドの架空例に合わせた規則です。実ログのID体系に合わせてください。

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 2048
parametrize_numeric_tokens = True
extra_delimiters = []

[MASKING]
mask_prefix = <
mask_suffix = >
masking = [
    {"regex_pattern": "[A-Za-z][A-Za-z0-9+.-]*://[^\\s\"'<>]+", "mask_with": "URL"},
    {"regex_pattern": "(?<![A-Za-z0-9_])[A-Za-z]:\\\\[^\\s\"'<>]*", "mask_with": "PATH"},
    {"regex_pattern": "\\\\\\\\[^\\s\"'<>]+", "mask_with": "PATH"},
    {"regex_pattern": "(?<![\\w.])/(?:[\\w.-]+/)+[\\w.-]*", "mask_with": "PATH"},
    {"regex_pattern": "(?<![\\d.])(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d+)?(?![\\d.])", "mask_with": "IP"},
    {"regex_pattern": "\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b", "mask_with": "UUID"},
    {"regex_pattern": "\\bJ-\\d+\\b", "mask_with": "JOBID"},
    {"regex_pattern": "\\b0x[0-9a-fA-F]+\\b", "mask_with": "HEX"},
    {"regex_pattern": "(?<![A-Za-z0-9_<])[A-Za-z]:(?=\\s|$)", "mask_with": "DRIVE"},
    {"regex_pattern": "(?<![A-Za-z0-9_<])[-+]?\\d+(?:\\.\\d+)?(?![A-Za-z0-9_])", "mask_with": "NUM"}
    ]
